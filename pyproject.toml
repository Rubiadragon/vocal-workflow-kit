[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vocal-workflow-kit"
version = "0.1.0"
description = "Local-first, auditable voice training and cover workflows"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
audio = ["numpy>=1.24", "soundfile>=0.12", "scipy>=1.10", "PyYAML>=6"]

[project.scripts]
vocal-workflow = "vocal_workflows.cli:main"

[tool.setuptools.packages.find]
include = ["vocal_workflows*"]
